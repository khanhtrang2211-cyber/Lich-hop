<style>

:root[data-theme="dark"]{--bg:#0f1420;--card:#171e2e;--tx:#e8ecf5;--mu:#8e9ab2;--bd:#263047;--pr:#5b8cff;--pr2:#1c2a4d;--ok:#35c98b;--wa:#f0b13a;--er:#ef6b7f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
h1{font-size:21px;margin:0}h1 small{display:block;font-size:12px;color:var(--mu);font-weight:400}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px}
.tabs button{border:0;background:none;color:var(--mu);padding:7px 14px;border-radius:9px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--pr);color:#fff}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:10px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px}

.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,textarea,select{width:100%;font:inherit;padding:9px 11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.bar input{flex:1;min-width:160px;width:auto}.bar select{width:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h3{margin:0;font-size:16px}.when{color:var(--pr);font-weight:600;font-size:13px;margin-top:2px}
.desc{color:var(--mu);margin:6px 0;white-space:pre-wrap}
.tag{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.t-up{background:var(--pr2);color:var(--pr)}.t-now{background:#fff1d6;color:#a86a00}.t-done{background:#dcf5ea;color:var(--ok)}.t-x{background:#fde5e9;color:var(--er)}
.cred{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.cred div{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:5px 10px;font-size:13px;display:flex;gap:8px;align-items:center}
.cred b{font-family:ui-monospace,Menlo,monospace}.cred button{border:0;background:none;color:var(--pr);cursor:pointer;font-size:12px;padding:0}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}.stat span{font-size:12px;color:var(--mu)}.stat b{display:block;font-size:26px}
.prog{height:12px;background:var(--bd);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--ok));border-radius:99px;transition:width .5s}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}.nav b{flex:1;text-align:center;min-width:150px}
.chart{overflow-x:auto}
dialog{border:0;border-radius:18px;padding:18px;width:min(520px,94vw);background:var(--card);color:var(--tx);max-height:92vh}
dialog::backdrop{background:rgba(10,15,30,.5)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}.row{display:flex;gap:10px}.row>*{flex:1}
.fl{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:6px}
.note{font-size:12px;color:var(--mu);margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#18202f;color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1}
:root{--bg:#eaeff7;--card:#fff;--tx:#14213d;--mu:#5f6f89;--bd:#d9e1ee;--pr:#1e55d6;--pr2:#e8eefb;--nv:#0a2351;--ac:#e0a93b;--ok:#0f9d6b;--wa:#e07b00;--er:#d23a4e}

:root[data-theme="dark"]{--bg:#0b1220;--card:#131c30;--tx:#e8ecf5;--mu:#93a1bb;--bd:#24304b;--pr:#6c9bff;--pr2:#1b2a4e;--nv:#2c4d96;--ac:#e8b44c;--ok:#35c98b;--wa:#f0a03a;--er:#ef6b7f}
body{background:linear-gradient(180deg,var(--bg),var(--bg))}
header{background:linear-gradient(135deg,#0a2351 0%,#1e55d6 100%);color:#fff;border-radius:18px;padding:16px 18px;margin:0 0 14px;box-shadow:0 8px 24px rgba(10,35,81,.25)}
header h1{color:#fff}header h1 small{color:#c9d8ff}

.wrap{max-width:1280px}

.card>b:first-child{display:inline-block;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:#cdd8f0;border-left:3px solid #3b82f6;padding-left:8px}

</style></head><body><div class="wrap">
<header>
 <h1>Lịch họp trực tuyến<small id="sub">Đang tải dữ liệu…</small></h1>
 <div style="display:flex;gap:8px;flex-wrap:wrap">
  <div class="tabs"><button id="tL" class="on">Cuộc họp</button><button id="tR">Báo cáo</button></div>
  <button class="btn" id="lg">🔑 Quản trị</button><button class="btn p" id="addp" hidden>📋 Dán thông báo</button><button class="btn" id="add" hidden>＋ Thêm</button>
 </div>
</header>

<div id="alert"></div>
<div id="adm" class="al" hidden style="animation:none;background:rgba(59,130,246,.12);border:1px solid #3b82f6;color:#93c5fd;box-shadow:none"></div>
<section id="vL">
 <div class="bar"><input id="q" placeholder="🔍 Tìm theo tên, nội dung, ID…"><select id="f"><option value="up">Sắp tới</option><option value="all">Tất cả</option><option value="past">Đã họp</option></select></div>
 <div id="list"></div>
</section>

<section id="vR" hidden>
 <div class="nav"><div class="tabs"><button id="pW" class="on">Tuần</button><button id="pM">Tháng</button></div>
  <button class="btn" id="prev">‹</button><b id="plab"></b><button class="btn" id="next">›</button><button class="btn" id="now">Hôm nay</button></div>
 <div class="grid" id="stats"></div>
 <div class="card"><b>Tiến độ hoàn thành</b><div style="display:flex;align-items:center;gap:10px;margin-top:8px"><div class="prog" style="flex:1"><i id="pb" style="width:0"></i></div><b id="pp">0%</b></div></div>
 <div class="card"><b>Số cuộc họp theo <span id="ul">ngày</span></b><div class="chart" id="chart"></div></div>
 <div class="card"><b>Phân công trực điểm cầu</b><div id="dutyc" style="margin-top:8px"></div></div>
 <div id="rl"></div>
</section>
</div>

<dialog id="dd"></dialog>
<dialog id="lgd" style="width:min(420px,94vw)"><b style="font-size:16px">🔑 Đăng nhập quản trị</b><label>Mã token GitHub (do admin tạo)</label><input id="lgc" type="password" autocomplete="off"><label>Kho GitHub</label><input id="lgr" placeholder="tên-tài-khoản/Lich-hop"><div class="note">Token chỉ lưu trên máy này. Người xem bình thường không cần đăng nhập.</div><div class="acts" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="lgx">Hủy</button><button class="btn p" id="lgo">Đăng nhập</button></div></dialog>
<dialog id="dlg"><div id="dh" style="font-weight:700;font-size:17px;margin-bottom:4px">Cuộc họp</div>

 <label>Tên cuộc họp *</label><input id="fn">
 <label>Nội dung</label><textarea id="fc" rows="3"></textarea>
 <div class="row"><div><label>Ngày giờ *</label><input id="fd" type="datetime-local"></div><div><label>Trạng thái</label><select id="fs"><option value="ok">Theo lịch</option><option value="x">Đã hủy</option></select></div></div>

 <label>Phân công trực điểm cầu (chọn 1 người)</label><div id="fdu"><label class="chip"><input type="checkbox" value="Đỗ Khánh Hoà"><span>Đỗ Khánh Hoà</span></label><label class="chip"><input type="checkbox" value="Nguyễn Nguyên Khoái"><span>Nguyễn Nguyên Khoái</span></label><label class="chip"><input type="checkbox" value="Trần Văn Tuấn"><span>Trần Văn Tuấn</span></label><label class="chip"><input type="checkbox" value="Nguyễn Nam Hà"><span>Nguyễn Nam Hà</span></label></div>
 <label>Công văn triển khai (PDF, ảnh, txt)</label><label id="dz" class="dz">📎 Kéo thả tệp vào đây, dán (Ctrl+V) hoặc <u>bấm để chọn tệp</u><input id="ff" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.txt,.csv,.md" style="display:none"></label>

</dialog>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const D=["CN","T2","T3","T4","T5","T6","T7"];
let db=null,assets=null,canW=false,items=[],cur=null,files=[],per="w",ref=new Date();
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)}

function parseNotice(t){
 t=t.normalize("NFC");
 const L=t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean),r={};
 const um=t.match(/https?:\/\/[^\s<>"]*(?:zoom\.(?:us|com)|meet\.google|teams\.(?:microsoft|live)|webex)[^\s<>"]*/i)||t.match(/https?:\/\/[^\s<>"]+/i);
 r.link=um?um[0].replace(/[).,;]+$/,""):"";
 let m=t.match(/(?:meeting[ \t]*id|id[ \t]*(?:cuộc[ \t]*)?họp|mã[ \t]*(?:cuộc[ \t]*)?họp|\bid)[ \t]*[:：\-]?[ \t]*(\d[\d \t\u00a0]{7,14}\d)/i);
 r.mid=m?m[1].replace(/[ \t\u00a0]+/g," ").trim():((r.link.match(/\/j\/(\d+)/)||[])[1]||"");
 m=t.match(/(?:passcode|pass[ \t]*code|password|mật[ \t]*khẩu|mật[ \t]*mã|\bpass)[ \t]*[:：\-]?[ \t]*([^\s,;]+)/i);
 r.pass=m?m[1]:"";
 const dre=/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{4})|(\d{1,2})\s*tháng\s*(\d{1,2})\s*(?:năm\s*)?(\d{4})/i;
 const tre=/(\d{1,2})\s*(?:h|giờ|g)\s*(\d{2})?(?![a-zà-ỹ])|(\d{1,2}):(\d{2})/i;
 for(const ln of L){if(/https?:|meeting id|passcode/i.test(ln))continue;const d=ln.match(dre);if(!d)continue;const tm=ln.replace(d[0]," ").match(tre);if(!tm)continue;
  const v=(d[3]||d[6])+"-"+pad(+(d[2]||d[5]))+"-"+pad(+(d[1]||d[4]))+"T"+pad(+(tm[1]||tm[3]))+":"+pad(+(tm[2]||tm[4]||0));
  if(/test|thử|trực/i.test(ln)){r.test=r.test||v}else{r.main=r.main||v}}
 m=t.match(/[“"«]([^”"»\n]{6,250})[”"»]/);
 r.name=m?m[1].trim().replace(/[.。]+$/,""):(L[0]||"").slice(0,120);
 r.desc=L.filter((s,i)=>!(/https?:|^join\s|meeting id|passcode|^đường link|^link|link[^:]*:\s*$/i.test(s)||/^[-–•\s:.]*$/.test(s)||(i===0&&m&&s.includes(m[1])))).map(s=>s.replace(/^[-–•]\s*/,"")).join("\n");
 return r}

const unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
async function ghGet(){const r=await api("/contents/data.json?ref="+GH.b+"&t="+Date.now());if(r.status===404)return{list:[],sha:null};if(!r.ok)throw new Error(r.status);const j=await r.json();let list=[];try{list=JSON.parse(unb64(j.content)).meetings||[]}catch(e){}return{list,sha:j.sha}}
async function ghPut(list,sha){const body={message:"Cập nhật lịch họp",content:b64(JSON.stringify({meetings:list,updated:new Date().toISOString()},null,1)),branch:GH.b};if(sha)body.sha=sha;const r=await api("/contents/data.json",{method:"PUT",body:JSON.stringify(body)});if(!r.ok)throw new Error(r.status)}
async function mutate(fn){toast("Đang lưu lên GitHub…");try{const g=await ghGet();fn(g.list);await ghPut(g.list,g.sha);items=g.list;renderList();if(!$("vR").hidden)renderRep();toast("Đã lưu — nhóm thấy sau khoảng 1–2 phút")}catch(e){toast(e.message==="401"||e.message==="403"?"Token không có quyền ghi vào kho":"Lưu thất bại ("+e.message+")");throw e}}
async function sv(m){await mutate(l=>{const i=l.findIndex(x=>x.id===m.id);if(i<0)l.push(m);else l[i]=m})}
async function pt(i,p){await mutate(l=>{const m=l.find(x=>x.id===i);if(m)Object.assign(m,p)})}
async function rm(i){await mutate(l=>{const k=l.findIndex(x=>x.id===i);if(k>=0)l.splice(k,1)})}
function upFile(f){return new Promise((res,rej)=>{if(f.size>10*1024*1024){rej({code:"quá 10MB"});return}const safe=Date.now()+"_"+f.name.replace(/[^\w.\-]+/g,"_"),r=new FileReader();r.onload=async()=>{try{const x=await api("/contents/files/"+safe,{method:"PUT",body:JSON.stringify({message:"Tải công văn",content:String(r.result).split(",")[1],branch:GH.b})});if(!x.ok)throw new Error(x.status);res({id:safe,url:"files/"+safe})}catch(e){rej({code:e.message})}};r.onerror=rej;r.readAsDataURL(f)})}
async function fetchPub(){const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;return(await r.json()).meetings||[]}
async function load(){try{items=canW?(await ghGet()).list:await fetchPub();renderList();if(!$("vR").hidden)renderRep()}catch(e){if(!items.length)$("sub").textContent="Không tải được dữ liệu"}}
function adm(){const b=$("adm");b.hidden=!canW;if(canW)b.innerHTML="🛠 <b>Chế độ quản trị</b> — mọi thay đổi tự lưu lên GitHub, nhóm thấy sau khoảng 1–2 phút."}
function setAdmin(on,n){canW=on;assets=on;$("add").hidden=!on;$("addp").hidden=!on;$("lg").textContent=on?"👤 "+n+" · Thoát":"🔑 Quản trị";adm();renderList()}
async function login(tok,quiet){GH.tok=tok;try{if(!GH.o||!GH.r)throw 0;const g=await ghGet();let n="Admin";try{n=(await(await fetch("https://api.github.com/user",{headers:{Authorization:"Bearer "+tok}})).json()).login||n}catch(e){}items=g.list;try{localStorage.setItem("lh_tok",tok);localStorage.setItem("lh_repo",GH.o+"/"+GH.r)}catch(e){}setAdmin(true,n);return true}catch(e){GH.tok="";if(!quiet)toast("Token không đúng hoặc không có quyền với kho này");return false}}
$("lg").onclick=()=>{if(canW){GH.tok="";try{localStorage.removeItem("lh_tok")}catch(e){}setAdmin(false);load();return}$("lgc").value="";$("lgr").value=GH.o&&GH.r?GH.o+"/"+GH.r:"";$("lgd").showModal();$("lgc").focus()};
$("lgx").onclick=()=>$("lgd").close();
$("lgo").onclick=async()=>{const c=$("lgc").value.trim(),rp=$("lgr").value.trim().split("/");if(!c)return;if(rp.length===2&&rp[0]&&rp[1]){GH.o=rp[0];GH.r=rp[1]}if(await login(c))$("lgd").close()};
$("lgc").addEventListener("keydown",e=>{if(e.key==="Enter")$("lgo").click()});
(async()=>{await load();if(GH.tok)await login(GH.tok,true);setInterval(load,60000)})();
setInterval(()=>{renderList();if(!$("vR").hidden)renderRep()},30000);
</script></body></html>
